<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DFS Stack vs BFS Queue 逐步動畫</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --cell: 54px;
  --c-bg:       #ffffff;
  --c-bg2:      #f5f6f8;
  --c-bg3:      #eceef1;
  --c-border:   #e2e4e9;
  --c-border2:  #c8ccd4;
  --c-text:     #1a1d23;
  --c-text2:    #4a5568;
  --c-text3:    #718096;
  --c-accent:   #4f46e5;
  --c-acc-bg:   #eef2ff;
  --c-acc-bd:   #a5b4fc;
  --c-info:     #1d4ed8;
  --c-warn:     #b45309;
  --c-warn-bg:  #fffbeb;
  --c-warn-bd:  #fbbf24;
  --c-path:     #0369a1;
  --c-path-bg:  #e0f2fe;
  --c-path-bd:  #7dd3fc;
  --c-dead-bg:  #f3f4f6;
  --c-green:    #059669;
  --c-green-bg: #d1fae5;
  --c-green-bd: #34d399;
  --c-red:      #dc2626;
  --c-red-bg:   #fee2e2;
  --c-red-bd:   #f87171;
  --c-code-bg:  #1e1e2e;
  --c-code-tx:  #cdd6f4;
  --c-code-hl:  #2e2b4e;
  --c-code-hlt: #f5c2e7;
  --c-code-num: #585b70;
  --radius:     8px;
  --mono:       'SF Mono','Cascadia Code','Fira Code','Courier New',monospace;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', sans-serif;
  background: var(--c-bg2);
  color: var(--c-text);
  min-height: 100vh;
  padding: 20px 16px 32px;
}

.app { max-width: 1120px; margin: 0 auto; }

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
h1 { font-size: 19px; font-weight: 800; color: var(--c-text); letter-spacing: -0.3px; }
h1 span { color: var(--c-accent); }

.vtabs { display: flex; gap: 6px; }
.vtab {
  padding: 7px 20px;
  border: 1.5px solid var(--c-border2);
  border-radius: 20px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  background: var(--c-bg);
  color: var(--c-text3);
  transition: all .15s;
}
.vtab:hover { border-color: var(--c-accent); color: var(--c-accent); }
.vtab.on { background: var(--c-accent); color: #fff; border-color: var(--c-accent); box-shadow: 0 2px 8px #4f46e540; }

/* ── Explanation ── */
.ebox {
  padding: 13px 18px;
  border-left: 4px solid var(--c-accent);
  background: var(--c-acc-bg);
  border-radius: 0 var(--radius) var(--radius) 0;
  font-size: 14.5px;
  color: var(--c-info);
  margin-bottom: 16px;
  font-weight: 500;
  min-height: 48px;
  line-height: 1.55;
  white-space: pre-wrap;
}

/* ── Main grid ── */
.main-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
  align-items: start;
}

.panel-label {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .07em;
  color: var(--c-text3);
  margin-bottom: 7px;
}

/* ── Code panel ── */
.left-panel { display: flex; flex-direction: column; }

.code-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 7px;
}

.code-badge {
  font-size: 11px;
  background: var(--c-code-bg);
  color: #89b4fa;
  padding: 2px 10px;
  border-radius: 10px;
  font-family: var(--mono);
  font-weight: 600;
}

.cpanel {
  background: var(--c-code-bg);
  border-radius: var(--radius);
  padding: 12px 0;
  overflow-x: auto;
  overflow-y: auto;
  font-family: var(--mono);
  font-size: 12.5px;
  line-height: 1.85;
  flex: 1;
  min-height: 200px;
  max-height: 420px;
  border: 1px solid #313244;
}

.cl {
  display: flex;
  align-items: baseline;
  padding: 0 16px 0 10px;
  white-space: pre;
  color: var(--c-code-tx);
  opacity: .55;
  transition: all .15s;
  cursor: default;
}
.cl .lnum {
  display: inline-block;
  width: 24px;
  color: var(--c-code-num);
  user-select: none;
  margin-right: 12px;
  text-align: right;
  flex-shrink: 0;
  font-size: 11px;
  padding-top: 1px;
}
.cl.on {
  background: var(--c-code-hl);
  color: var(--c-code-hlt);
  opacity: 1;
  font-weight: 700;
  border-left: 3px solid #f5c2e7;
  padding-left: 7px;
}
.cl:not(.on):hover { opacity: .8; }

/* ── Right panel ── */
.right-panel { display: flex; flex-direction: column; gap: 14px; }

/* Maze */
.maze-section {
  background: var(--c-bg);
  border: 1px solid var(--c-border);
  border-radius: var(--radius);
  padding: 16px;
}
.maze-inner {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  flex-wrap: wrap;
}
.mgrid {
  display: grid;
  gap: 5px;
  flex-shrink: 0;
}
.mc {
  width: var(--cell);
  height: var(--cell);
  border-radius: 7px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 11.5px;
  font-family: var(--mono);
  border: 1.5px solid var(--c-border);
  background: var(--c-bg);
  color: var(--c-text3);
  transition: background .18s, border-color .18s;
  font-weight: 500;
  line-height: 1.2;
  position: relative;
  overflow: hidden;
}
.mc .coord { font-size: 9px; opacity: .45; margin-top: 2px; }
.mc.mwall  { background: #293241; border-color: #293241; color: #4a5568; }
.mc.mwall .coord { display: none; }
.mc.mcur   { background: var(--c-acc-bg); border: 2.5px solid var(--c-accent); color: var(--c-accent); font-weight: 800; }
.mc.mvis   { background: var(--c-dead-bg); border-color: #d1d5db; color: #9ca3af; }
.mc.mdead  { background: var(--c-dead-bg); border: 2px dashed #9ca3af; color: #9ca3af; }
.mc.mcand  { background: var(--c-warn-bg); border-color: var(--c-warn-bd); color: var(--c-warn); font-weight: 700; }
.mc.mpath  { background: var(--c-path-bg); border: 2.5px solid var(--c-path-bd); color: var(--c-path); font-weight: 800; }
.mc.mgoal  { border: 2.5px solid var(--c-accent); color: var(--c-accent); font-weight: 800; }
.mc.mfound { background: var(--c-green-bg); border: 2.5px solid var(--c-green-bd); color: var(--c-green); font-weight: 800; }

.maze-legend { font-size: 11.5px; color: var(--c-text3); line-height: 1; flex: 1; min-width: 120px; }
.lrow { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; white-space: nowrap; }
.ld { display: inline-block; width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0; }

/* Node viz */
.varea-section {
  background: var(--c-bg);
  border: 1px solid var(--c-border);
  border-radius: var(--radius);
  padding: 16px;
  min-height: 90px;
}
.nrow {
  display: flex;
  align-items: flex-start;
  gap: 4px;
  flex-wrap: wrap;
  row-gap: 10px;
}
.nbox { display: flex; flex-direction: column; align-items: center; min-width: 70px; }
.nc {
  border: 1.5px solid var(--c-border2);
  border-radius: 7px;
  padding: 6px 9px;
  font-size: 12px;
  font-family: var(--mono);
  text-align: center;
  min-width: 64px;
  line-height: 1.35;
  background: var(--c-bg);
  transition: all .18s;
}
.nc.ncur  { border-color: var(--c-accent); background: var(--c-acc-bg);   color: var(--c-accent); font-weight: 800; }
.nc.ncand { border-color: var(--c-warn-bd); background: var(--c-warn-bg);  color: var(--c-warn);   font-weight: 600; }
.nc.nnew  { border-color: var(--c-red-bd); background: var(--c-red-bg);   color: var(--c-red);    font-weight: 700; }
.nc.ndead { border-color: #9ca3af; background: var(--c-dead-bg); color: #9ca3af; text-decoration: line-through; opacity: .5; }
.nc.npath { border-color: var(--c-path-bd); background: var(--c-path-bg); color: var(--c-path);   font-weight: 800; }
.arw { font-size: 17px; color: var(--c-text3); margin: 0 2px; padding-top: 7px; }
.plbl { font-size: 10.5px; color: var(--c-text2); margin-top: 4px; font-family: var(--mono); text-align: center; min-height: 15px; font-weight: 700; }
.nlbl { font-size: 11px; color: var(--c-text3); font-family: var(--mono); padding: 5px 8px; border: 1px dashed var(--c-border2); border-radius: 6px; margin-top: 4px; align-self: flex-start; }

/* Direction row */
.drow { margin-top: 12px; font-size: 12.5px; color: var(--c-text2); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.ddir-label { font-weight: 600; margin-right: 2px; }
.db { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 12px; font-family: var(--mono); font-weight: 600; }
.dd { background: var(--c-green-bg); color: var(--c-green); border: 1px solid var(--c-green-bd); }
.ds { background: var(--c-dead-bg); color: #9ca3af; border: 1px solid #d1d5db; text-decoration: line-through; opacity: .55; }
.dp { background: var(--c-bg2); color: var(--c-text3); border: 1px solid var(--c-border); }

.note {
  font-size: 12.5px;
  color: var(--c-text2);
  margin-top: 12px;
  padding: 9px 14px;
  border-left: 3px solid var(--c-acc-bd);
  background: var(--c-acc-bg);
  border-radius: 0 6px 6px 0;
  line-height: 1.6;
}

.found-banner {
  margin-bottom: 12px;
  padding: 10px 16px;
  background: var(--c-green-bg);
  border: 1.5px solid var(--c-green-bd);
  border-radius: 7px;
  font-size: 14px;
  color: var(--c-green);
  font-weight: 800;
}

/* ── Controls ── */
.ctrls {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.btn {
  padding: 9px 22px;
  font-size: 13.5px;
  font-weight: 700;
  border: 1.5px solid var(--c-border2);
  border-radius: 20px;
  cursor: pointer;
  background: var(--c-bg);
  color: var(--c-text);
  transition: all .15s;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover:not(:disabled) { background: var(--c-bg3); border-color: var(--c-accent); color: var(--c-accent); }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn:disabled { opacity: .3; cursor: default; }
.btnp { background: var(--c-accent); color: #fff; border-color: var(--c-accent); box-shadow: 0 2px 10px #4f46e535; }
.btnp:hover:not(:disabled) { background: #4338ca; border-color: #4338ca; color: #fff; }
.sinfo { font-size: 12px; color: var(--c-text3); margin-left: auto; text-align: right; line-height: 1.6; font-family: var(--mono); }

/* ── Responsive ── */
@media (max-width: 720px) {
  :root { --cell: 42px; }
  body { padding: 12px 10px 28px; }
  h1 { font-size: 16px; }
  header { gap: 10px; margin-bottom: 10px; }
  .vtab { padding: 6px 14px; font-size: 12.5px; }
  .main-grid { grid-template-columns: 1fr; gap: 12px; }
  .left-panel  { order: 2; }
  .right-panel { order: 1; }
  .cpanel { font-size: 11.5px; max-height: 260px; }
  .btn { padding: 8px 16px; font-size: 12.5px; }
  .ebox { font-size: 13.5px; padding: 10px 14px; }
  .mc { font-size: 10.5px; border-radius: 5px; }
  .mc .coord { font-size: 8px; }
}

@media (max-width: 420px) {
  :root { --cell: 36px; }
  .mc { font-size: 9.5px; }
  .mc .coord { display: none; }
  .nc { font-size: 11px; min-width: 56px; padding: 4px 6px; }
}
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>DFS <span>Stack</span> vs BFS Queue 逐步動畫</h1>
    <div class="vtabs">
      <button class="vtab on" onclick="sw('stack')">Stack DFS</button>
      <button class="vtab"    onclick="sw('queue')">Queue BFS</button>
    </div>
  </header>

  <div class="ebox" id="ebox">點「下一步」開始</div>

  <div class="main-grid">

    <!-- Left: code panel -->
    <div class="left-panel">
      <div class="code-header">
        <div class="panel-label">演算法程式碼（C++）</div>
        <div class="code-badge" id="codebadge">stack DFS</div>
      </div>
      <div class="cpanel" id="cpanel"></div>
    </div>

    <!-- Right: maze + node viz -->
    <div class="right-panel">

      <div class="maze-section">
        <div class="panel-label">迷宮狀態</div>
        <div class="maze-inner">
          <div id="mgrid" class="mgrid"></div>
          <div class="maze-legend">
            <div class="lrow"><span class="ld" style="background:var(--c-acc-bg);border:2px solid var(--c-accent)"></span>目前 pop/dequeue</div>
            <div class="lrow"><span class="ld" style="background:var(--c-path-bg);border:2px solid var(--c-path-bd)"></span>正確路徑</div>
            <div class="lrow"><span class="ld" style="background:var(--c-dead-bg);border:2px dashed #9ca3af"></span>死路（已拜訪）</div>
            <div class="lrow"><span class="ld" style="background:var(--c-warn-bg);border:1.5px solid var(--c-warn-bd)"></span>stack/queue 中</div>
            <div class="lrow"><span class="ld" style="background:var(--c-dead-bg);border:1px solid #d1d5db"></span>已拜訪</div>
            <div class="lrow"><span class="ld" style="background:#293241;border:1px solid #293241"></span>牆</div>
          </div>
        </div>
      </div>

      <div class="varea-section">
        <div class="panel-label" id="varea-label">Stack 節點狀態</div>
        <div id="varea"><span style="font-size:13px;color:var(--c-text3)">點「下一步」開始</span></div>
      </div>

    </div>
  </div>

  <div class="ctrls">
    <button class="btn"      onclick="prev()" id="bprev" disabled>← 上一步</button>
    <button class="btn btnp" onclick="next()" id="bnext">下一步 →</button>
    <button class="btn"      onclick="reset()">重置</button>
    <div class="sinfo" id="sinfo"></div>
  </div>

</div><!-- /app -->

<script>
/*
迷宮（5×5，S=(0,0) G=(0,4)）:
     0    1    2    3    4
0  [ S ][ 0 ][ W ][ 0 ][ G ]
1  [ 0 ][ W ][ 0 ][ W ][ 0 ]
2  [ 0 ][ 0 ][ 0 ][ 0 ][ 0 ]
3  [ W ][ W ][ 0 ][ W ][ W ]
4  [ W ][ W ][ 0 ][ W ][ W ]
Push順序 d=0上 d=1右 d=2下 d=3左  (LIFO→左先pop)
*/

const MAZE=[[0,0,1,0,0],[0,1,0,1,0],[0,0,0,0,0],[1,1,0,1,1],[1,1,0,1,1]];
const ROWS=5,COLS=5,START=[0,0],GOAL=[0,4];
const PATH_CELLS=[[0,0],[1,0],[2,0],[2,1],[2,2],[2,3],[2,4],[1,4],[0,4]];

const SL=[
  'while (stackHead != nullptr) {',
  '    PathNode* top = stackHead;',
  '    int r=top->r, c=top->c;',
  '    stackHead = stackHead->next;',
  '    delete top;',
  '    if (visited[r][c]) continue;',
  '    visited[r][c] = true;',
  '    if (r==eR && c==eC) { found=true; break; }',
  '    for (int d=0; d<4; d++) {',
  '        // d=0上 d=1右 d=2下 d=3左',
  '        if (valid && !visited[nr][nc]...) {',
  '            stackHead=new PathNode(nr,nc,stackHead);',
  '        }',
  '    }',
  '}',
];
const QL=[
  'while (qHead != nullptr) {',
  '    int r=qHead->r, c=qHead->c;',
  '    PathNode* old = qHead;',
  '    qHead = qHead->next;',
  '    if (!qHead) qTail = nullptr;',
  '    delete old;',
  '    if (r==eR && c==eC) { found=true; break; }',
  '    for (int d=0; d<4; d++) {',
  '        if (valid && !visited[nr][nc]...) {',
  '            visited[nr][nc]=true;',
  '            PathNode* node=new PathNode(nr,nc,nullptr);',
  '            if (qTail) qTail->next=node;',
  '            else        qHead=node;',
  '            qTail=node;',
  '        }',
  '    }',
  '}',
];

function S(line,round,explain,nodes,ptrs,maze,opts={}){
  return{line,round,explain,nodes,ptrs,maze,...opts};
}

const SS=[
  S(0,1,'while 成立，pop (0,0)',
    [{l:'S(0,0)',s:'ncur'}],{stackHead:0,top:0},
    {cur:[0,0],vis:[],cand:[],dead:[],path:[]}),
  S(4,1,'delete top，釋放 (0,0)',
    [],{},
    {cur:[0,0],vis:[],cand:[],dead:[],path:[]},{hnull:true}),
  S(6,1,'visited[0][0] = true',
    [],{},
    {cur:[0,0],vis:[[0,0]],cand:[],dead:[],path:[]},{hnull:true}),
  S(7,1,'(0,0) ≠ 終點，探索四方向（上右下左，LIFO → 左先pop）',
    [],{},
    {cur:[0,0],vis:[[0,0]],cand:[],dead:[],path:[]},{hnull:true}),
  S(11,1,'push (0,1)，再 push (1,0)。LIFO → (1,0) 最先 pop',
    [{l:'(1,0)',s:'nnew'},{l:'(0,1)',s:'ncand'}],{stackHead:0},
    {cur:[0,0],vis:[[0,0]],cand:[[0,1],[1,0]],dead:[],path:[]},
    {dirs:['s','d','d','s'],note:'push 右(0,1) 後再 push 下(1,0)，LIFO → (1,0) 在頭'}),

  S(0,2,'第 2 輪：pop (1,0)（LIFO，最後 push 的先出）',
    [{l:'(1,0)',s:'ncur'},{l:'(0,1)',s:'ncand'}],{stackHead:0,top:0},
    {cur:[1,0],vis:[[0,0]],cand:[[0,1]],dead:[],path:[]}),
  S(6,2,'visited[1][0] = true',
    [{l:'(0,1)',s:'ncand'}],{stackHead:0},
    {cur:[1,0],vis:[[0,0],[1,0]],cand:[[0,1]],dead:[],path:[]}),
  S(11,2,'下(2,0)合法 → push。其餘visited/牆/越界',
    [{l:'(2,0)',s:'nnew'},{l:'(0,1)',s:'ncand'}],{stackHead:0},
    {cur:[1,0],vis:[[0,0],[1,0]],cand:[[0,1],[2,0]],dead:[],path:[]},
    {dirs:['s','s','d','s']}),

  S(0,3,'第 3 輪：pop (2,0)。(0,1) 繼續等在 stack 裡',
    [{l:'(2,0)',s:'ncur'},{l:'(0,1)',s:'ncand'}],{stackHead:0,top:0},
    {cur:[2,0],vis:[[0,0],[1,0]],cand:[[0,1]],dead:[],path:[]}),
  S(6,3,'visited[2][0] = true',
    [{l:'(0,1)',s:'ncand'}],{stackHead:0},
    {cur:[2,0],vis:[[0,0],[1,0],[2,0]],cand:[[0,1]],dead:[],path:[]}),
  S(11,3,'右(2,1)合法 → push',
    [{l:'(2,1)',s:'nnew'},{l:'(0,1)',s:'ncand'}],{stackHead:0},
    {cur:[2,0],vis:[[0,0],[1,0],[2,0]],cand:[[0,1],[2,1]],dead:[],path:[]},
    {dirs:['s','d','s','s']}),

  S(0,4,'第 4 輪：pop (2,1)',
    [{l:'(2,1)',s:'ncur'},{l:'(0,1)',s:'ncand'}],{stackHead:0,top:0},
    {cur:[2,1],vis:[[0,0],[1,0],[2,0]],cand:[[0,1]],dead:[],path:[]}),
  S(6,4,'visited[2][1] = true',
    [{l:'(0,1)',s:'ncand'}],{stackHead:0},
    {cur:[2,1],vis:[[0,0],[1,0],[2,0],[2,1]],cand:[[0,1]],dead:[],path:[]}),
  S(11,4,'右(2,2)合法 → push',
    [{l:'(2,2)',s:'nnew'},{l:'(0,1)',s:'ncand'}],{stackHead:0},
    {cur:[2,1],vis:[[0,0],[1,0],[2,0],[2,1]],cand:[[0,1],[2,2]],dead:[],path:[]},
    {dirs:['s','d','s','s']}),

  S(0,5,'第 5 輪：pop (2,2)，有三個合法鄰居！',
    [{l:'(2,2)',s:'ncur'},{l:'(0,1)',s:'ncand'}],{stackHead:0,top:0},
    {cur:[2,2],vis:[[0,0],[1,0],[2,0],[2,1]],cand:[[0,1]],dead:[],path:[]}),
  S(6,5,'visited[2][2] = true',
    [{l:'(0,1)',s:'ncand'}],{stackHead:0},
    {cur:[2,2],vis:[[0,0],[1,0],[2,0],[2,1],[2,2]],cand:[[0,1]],dead:[],path:[]}),

let mode='stack', step=-1;

function sw(m){
  mode=m;
  document.querySelectorAll('.vtab').forEach((t,i)=>
    t.classList.toggle('on',(m==='stack'&&i===0)||(m==='queue'&&i===1)));
  document.getElementById('codebadge').textContent = m==='stack'?'stack DFS':'queue BFS';
  document.getElementById('varea-label').textContent = m==='stack'?'Stack 節點狀態':'Queue 節點狀態';
  reset();
}

function reset(){
  step=-1; rc(-1);
  document.getElementById('ebox').textContent='點「下一步」開始';
  rv(null); rm(null);
  document.getElementById('bprev').disabled=true;
  document.getElementById('bnext').disabled=false;
  document.getElementById('sinfo').innerHTML='';
}

function gs(){ return mode==='stack'?SS:QS; }
function gl(){ return mode==='stack'?SL:QL; }

function rc(al){
  document.getElementById('cpanel').innerHTML=gl().map((l,i)=>{
    const on=i===al;
    const cls='cl'+(on?' on':'');
    return`<div class="${cls}"><span class="lnum">${i+1}</span>${l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`;
  }).join('');
  if(al>=0){
    setTimeout(()=>{
      const hl=document.querySelector('.cl.on');
      if(hl) hl.scrollIntoView({block:'nearest',behavior:'smooth'});
    },40);
  }
}

function next(){ const s=gs(); if(step<s.length-1){step++; upd();} }
function prev(){ if(step>0){step--; upd();} else{step=-1; reset();} }

function upd(){
  const s=gs()[step];
  rc(s.line);
  document.getElementById('ebox').textContent=s.explain;
  rv(s); rm(s);
  document.getElementById('bprev').disabled=step<=0;
  document.getElementById('bnext').disabled=step>=gs().length-1;
  document.getElementById('sinfo').innerHTML=
    `步驟 ${step+1} / ${gs().length}<br>第 ${s.round} 輪`;
}

function rv(s){
  const el=document.getElementById('varea');
  if(!s){ el.innerHTML='<span style="font-size:13px;color:var(--c-text3)">點「下一步」開始</span>'; return; }
  const{nodes=[],ptrs={},hnull,dirs,found,note}=s;
  const pf=idx=>Object.entries(ptrs).filter(([,n])=>n===idx).map(([k])=>k);
  let h='';
  if(found) h+=`<div class="found-banner">找到終點！路徑標藍</div>`;
  h+='<div class="nrow">';
  const isEmpty=hnull&&nodes.length===0;
  if(isEmpty) h+=`<span style="font-size:12.5px;color:var(--c-text3);font-family:var(--mono)">${mode==='stack'?'stackHead':'qHead/qTail'} = null</span>`;
  nodes.forEach((nd,i)=>{
    const cc='nc '+(nd.s||'');
    const pl=pf(i);
    h+=`<div class="nbox"><div class="${cc}">${nd.l}<br><span style="font-size:9px;opacity:.45">next→</span></div><div class="plbl">${pl.join(' / ')||''}</div></div>`;
    if(i<nodes.length-1) h+=`<div class="arw">→</div>`;
  });
  if(nodes.length>0) h+=`<div class="arw">→</div><div class="nlbl">null</div>`;
  h+='</div>';
  if(dirs){
    const DL=['上','右','下','左'];
    h+='<div class="drow"><span class="ddir-label">方向：</span>';
    dirs.forEach((st,i)=>{
      const c=st==='d'?'dd':st==='s'?'ds':'dp';
      h+=`<span class="db ${c}">${DL[i]}</span>`;
    });
    h+='</div>';
  }
  if(note) h+=`<div class="note">${note}</div>`;
  el.innerHTML=h;
}

function rm(s){
  const el=document.getElementById('mgrid');
  if(!s||!s.maze){ el.innerHTML=''; return; }
  el.style.gridTemplateColumns=`repeat(${COLS},var(--cell))`;
  const{cur,vis=[],cand=[],dead=[],path=[]}=s.maze;
  const has=(a,r,c)=>a.some(([rr,cc])=>rr===r&&cc===c);
  let h='';
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const isCur=cur&&cur[0]===r&&cur[1]===c;
    const isGoal=r===GOAL[0]&&c===GOAL[1];
    const isStart=r===START[0]&&c===START[1];
    let cc='mc', lbl='';
    if(isStart) lbl='S';
    else if(isGoal) lbl='G';
    else lbl=`${r},${c}`;
    const coord=`<span class="coord">(${r},${c})</span>`;
    if(MAZE[r][c]===1){ cc+=' mwall'; h+=`<div class="${cc}">▪</div>`; continue; }
    if(path.length>0&&has(path,r,c))     cc+=' mpath';
    else if(isCur)                        cc+=' mcur';
    else if(has(dead,r,c))               cc+=' mdead';
    else if(has(cand,r,c))               cc+=' mcand';
    else if(has(vis,r,c))                cc+=' mvis';
    else if(isGoal)                      cc+=' mgoal';
    h+=`<div class="${cc}">${lbl}${coord}</div>`;
  }
  el.innerHTML=h;
}

// init
rc(-1);
rm(null);
